<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Coin AI - Demo</title>
    <style>
      body { font-family: Arial, Helvetica, sans-serif; max-width: 700px; margin: 2rem auto; }
      #chat { border: 1px solid #ddd; padding: 1rem; height: 400px; overflow: auto; }
      .msg { margin: 0.5rem 0; }
      .user { color: blue; }
      .assistant { color: green; }
    </style>
  </head>
  <body>
    <h1>Coin AI — Demo</h1>
    <div id="chat"></div>
    <form id="form">
      <input id="input" type="text" placeholder="Say something" style="width:80%" />
      <button type="submit">Send</button>
    </form>

    <script>
      const chat = document.getElementById('chat');
      const form = document.getElementById('form');
      const input = document.getElementById('input');

      function append(role, text) {
        const d = document.createElement('div');
        d.className = 'msg ' + role;
        d.textContent = (role === 'user' ? 'You: ' : 'AI: ') + text;
        chat.appendChild(d);
        chat.scrollTop = chat.scrollHeight;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        append('user', text);
        input.value = '';

        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text })
          });
          const data = await res.json();
          // Azure Chat Completions responses typically have choices[0].message.content
          const reply = data?.choices?.[0]?.message?.content || JSON.stringify(data);
          append('assistant', reply);
        } catch (err) {
          append('assistant', 'Error: ' + err.message);
        }
      });
    </script>
  </body>
</html>
