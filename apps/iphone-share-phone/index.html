<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><title>iPhone Share → TV</title><style>body{font-family:system-ui;background:#0b0d12;color:#fff;margin:0;padding:24px}main{max-width:620px;margin:auto}h1{font-size:32px}section{background:#171b24;border-radius:20px;padding:18px;margin:16px 0}input,button{width:100%;padding:15px;border-radius:14px;border:0;font:inherit;margin-top:10px}button{font-weight:700}.hint{opacity:.7;font-size:14px}.drop{border:2px dashed #555;text-align:center;padding:25px;border-radius:16px}</style></head><body><main><h1>📺 iPhone Share</h1><p class="hint">Open this page using the TV's address shown on the Fire Stick. Everything is sent directly over your local Wi‑Fi.</p><section><label>TV address</label><input id="base" placeholder="http://192.168.1.50:8080"><div class="drop"><input id="files" type="file" accept="image/*,.pdf,.txt" multiple></div><button id="send">Send selected files to TV</button><p id="status" class="hint"></p></section><section><label>Display a web page on TV</label><input id="url" type="url" placeholder="https://example.com"><button id="showUrl">Show web page</button></section><section><button id="prev">◀ Previous</button><button id="next">Next ▶</button><button id="clear">Clear TV</button></section></main><script>const $=x=>document.getElementById(x);function base(){return $('base').value.trim().replace(/\/$/,'')}async function post(path,body,headers={}){const r=await fetch(base()+path,{method:'POST',body,headers});if(!r.ok)throw new Error(await r.text());return r}$('send').onclick=async()=>{const fs=[...$('files').files];if(!fs.length)return;$('status').textContent='Sending…';try{for(let i=0;i<fs.length;i++){const f=fs[i];await post('/upload?name='+encodeURIComponent(f.name),f,{ 'Content-Type':f.type||'application/octet-stream'});$('status').textContent=`Sent ${i+1} of ${fs.length}: ${f.name}`}}catch(e){$('status').textContent='Connection error: '+e.message}};$('showUrl').onclick=async()=>{try{await post('/url',$('url').value,{ 'Content-Type':'text/plain'});$('status').textContent='Web page sent to TV'}catch(e){$('status').textContent=e.message}};$('prev').onclick=()=>post('/prev','').catch(()=>{});$('next').onclick=()=>post('/next','').catch(()=>{});$('clear').onclick=()=>post('/clear','').catch(()=>{});</script></body></html>
