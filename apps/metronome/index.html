<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><link rel="manifest" href="manifest.webmanifest"><title>Metronome</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#fff;background:#0b0d12}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.app{width:min(560px,100%);text-align:center}.beat{font-size:clamp(72px,22vw,150px);font-weight:800;line-height:1;margin:25px 0}.bpm{font-size:24px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}button,input{font:inherit}button{border:0;border-radius:16px;padding:16px;background:#202532;color:#fff;font-weight:700}button.primary{background:#fff;color:#0b0d12}input[type=range]{width:100%}.small{opacity:.7;font-size:14px}</style></head><body><main class="app"><div class="small">METRONOME</div><div id="beat" class="beat">1</div><div id="bpmText" class="bpm">120 BPM</div><input id="tempo" type="range" min="30" max="240" value="120"><div class="controls"><button id="minus">−5</button><button id="plus">+5</button><button id="start" class="primary">Start</button><button id="tap">Tap Tempo</button></div><p class="small">Works offline after the page is cached. Audio is generated locally.</p></main><script>let bpm=120,running=false,timer=null,count=0,audio;const $=id=>document.getElementById(id);function render(){$('tempo').value=bpm;$('bpmText').textContent=bpm+' BPM'}function tick(){count=count%4+1;$('beat').textContent=count;if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=count===1?1100:700;g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.22,audio.currentTime+.005);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.07);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.08)}function start(){running=!running;$('start').textContent=running?'Stop':'Start';if(running){count=0;tick();timer=setInterval(tick,60000/bpm)}else clearInterval(timer)}function setBpm(v){bpm=Math.max(30,Math.min(240,v));render();if(running){clearInterval(timer);timer=setInterval(tick,60000/bpm)}}$('tempo').oninput=e=>setBpm(+e.target.value);$('minus').onclick=()=>setBpm(bpm-5);$('plus').onclick=()=>setBpm(bpm+5);$('start').onclick=start;let taps=[];$('tap').onclick=()=>{const now=performance.now();taps=taps.filter(t=>now-t<2500);taps.push(now);if(taps.length>1){const avg=(taps[taps.length-1]-taps[0])/(taps.length-1);setBpm(Math.round(60000/avg))}if(taps.length>=6)taps=[]};render();</script></body></html>
