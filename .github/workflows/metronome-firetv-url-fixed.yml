name: Build Metronome Fire TV APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        run: |
          rm -rf firetv-build
          mkdir -p firetv-build/app/src/main/java/com/keenoncoins/metronome
          mkdir -p firetv-build/app/src/main/assets
          mkdir -p firetv-build/app/src/main/res/values
          mkdir -p firetv-build/app/src/main/res/drawable

          cat > firetv-build/app/src/main/assets/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <title>Fire TV Web App</title>
          <style>
          :root{--bg:#0b0d10;--panel:#151920;--text:#f5f7fa;--muted:#9da6b2;--accent:#5ee1a2;--danger:#ff6978}
          *{box-sizing:border-box}
          body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
          .app{max-width:900px;margin:auto;padding:42px 34px 50px}
          h1{font-size:36px;margin:0 0 8px}.sub{color:var(--muted);font-size:18px;margin-bottom:28px}
          .card{background:var(--panel);border-radius:20px;padding:24px;margin:16px 0}
          label{display:block;font-size:18px;font-weight:700;margin-bottom:12px}
          input[type=url]{width:100%;background:#0e1116;border:2px solid #343c47;color:white;border-radius:12px;padding:16px;font-size:20px}
          input:focus{outline:4px solid #fff;outline-offset:3px;border-color:#fff}
          button{border:0;border-radius:13px;padding:16px 22px;font-size:18px;font-weight:700;background:#262d36;color:white;cursor:pointer;min-height:58px}
          button.primary{background:var(--accent);color:#07120c;flex:2}
          button.secondary{flex:1}
          button.danger{background:var(--danger);color:#190509}
          .row{display:flex;gap:12px;margin-top:16px}
          .status{margin-top:16px;padding:14px;border-radius:12px;background:#0e1116;color:var(--muted);font-size:16px;word-break:break-all}
          .saved{color:var(--accent)}
          .small{font-size:14px;color:var(--muted);line-height:1.5;margin-top:14px}
          button:focus{outline:4px solid #fff;outline-offset:3px}
          </style>
          </head>
          <body>
          <div class="app">
            <h1>Fire TV Web App</h1>
            <div class="sub">Enter a website address, save it, and open it on your Fire TV.</div>
            <div class="card">
              <label for="url">Website URL</label>
              <input id="url" type="url" inputmode="url" autocomplete="off"
                     placeholder="https://example.com" tabindex="0">
              <div class="row">
                <button id="saveOpen" class="primary" tabindex="0">Save &amp; Open</button>
                <button id="openSaved" class="secondary" tabindex="0">Open Saved</button>
              </div>
              <div class="row">
                <button id="clear" class="danger" tabindex="0">Clear Saved URL</button>
              </div>
              <div id="status" class="status">No URL saved.</div>
              <div class="small">
                The saved address is stored on this Fire TV. Enter a complete address beginning with
                http:// or https://.
              </div>
            </div>
          </div>
          <script>
          const $=id=>document.getElementById(id), KEY="firetv_saved_url";
          function normalise(value){
            value=(value||"").trim(); if(!value)return "";
            if(!/^https?:\/\//i.test(value))value="https://"+value;
            try{const u=new URL(value);return (u.protocol==="http:"||u.protocol==="https:")?u.href:"";}
            catch(e){return "";}
          }
          function saved(){return localStorage.getItem(KEY)||"";}
          function show(){
            const v=saved();
            $("status").textContent=v?"Saved URL: "+v:"No URL saved.";
            $("status").className=v?"status saved":"status";
            $("url").value=v;
          }
          function save(){
            const v=normalise($("url").value);
            if(!v){$("status").textContent="Please enter a valid http:// or https:// website address.";$("status").className="status";$("url").focus();return "";}
            localStorage.setItem(KEY,v);show();return v;
          }
          $("saveOpen").onclick=()=>{const v=save();if(v)location.href=v;};
          $("openSaved").onclick=()=>{const v=saved()||save();if(v)location.href=v;};
          $("clear").onclick=()=>{localStorage.removeItem(KEY);show();$("url").focus();};
          $("url").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();$("saveOpen").click();}});
          const focusables=()=>Array.from(document.querySelectorAll("input,button")).filter(e=>!e.disabled&&e.offsetParent!==null);
          let focusIndex=0;
          function setFocus(i){const a=focusables();if(!a.length)return;focusIndex=Math.max(0,Math.min(i,a.length-1));a[focusIndex].focus();}
          document.addEventListener("keydown",e=>{
            const a=focusables(),cur=document.activeElement,idx=a.indexOf(cur);
            if(idx>=0)focusIndex=idx;
            if((e.key==="ArrowDown"||e.key==="ArrowRight")&&!(cur&&cur.tagName==="INPUT"&&e.key==="ArrowRight")){
              e.preventDefault();setFocus((focusIndex+1)%a.length);
            }else if((e.key==="ArrowUp"||e.key==="ArrowLeft")&&!(cur&&cur.tagName==="INPUT"&&e.key==="ArrowLeft")){
              e.preventDefault();setFocus((focusIndex-1+a.length)%a.length);
            }else if((e.key==="Enter"||e.key===" ")&&cur&&cur.tagName==="BUTTON"){e.preventDefault();cur.click();}
          });
          show();setTimeout(()=>{(saved()?$("openSaved"):$("url")).focus();},150);
          </script>
          </body>
          </html>
          HTML

          cat > firetv-build/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MetronomeFireTV"
          include(":app")
          EOF

          cat > firetv-build/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > firetv-build/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.keenoncoins.metronome'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.keenoncoins.metronome'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > firetv-build/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Metronome Video</string>
          </resources>
          EOF

          cat > firetv-build/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:colorAccent">#ffffff</item>
                  <item name="android:navigationBarColor">#090b10</item>
                  <item name="android:statusBarColor">#090b10</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF

          cat > firetv-build/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature
                  android:name="android.software.leanback"
                  android:required="false" />

              <uses-feature
                  android:name="android.hardware.touchscreen"
                  android:required="false" />

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="@string/app_name"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:resizeableActivity="false">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="landscape"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > firetv-build/app/src/main/java/com/keenoncoins/metronome/MainActivity.java <<'EOF'
          package com.keenoncoins.metronome;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.KeyEvent;
          import android.view.View;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView web;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setFlags(
                      android.view.WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      android.view.WindowManager.LayoutParams.FLAG_FULLSCREEN
                  );

                  web = new WebView(this);
                  web.setFocusable(true);
                  web.setFocusableInTouchMode(true);
                  web.requestFocus(View.FOCUS_DOWN);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  s.setBuiltInZoomControls(false);
                  s.setDisplayZoomControls(false);

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(
                              WebView view, WebResourceRequest request) {
                          return false;
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(
                              WebView view, String url) {
                          return false;
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient());

                  web.loadUrl("file:///android_asset/index.html");
                  setContentView(web);
              }

              @Override
              public boolean dispatchKeyEvent(KeyEvent event) {
                  if (web != null && event.getAction() == KeyEvent.ACTION_DOWN) {
                      web.requestFocus();
                  }
                  return super.dispatchKeyEvent(event);
              }

              @Override
              public void onBackPressed() {
                  if (web != null && web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (web != null) {
                      web.stopLoading();
                      web.destroy();
                      web = null;
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Install Gradle
        run: |
          curl -L --fail -o gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Build Fire TV APK
        working-directory: firetv-build
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare APK
        run: |
          cp firetv-build/app/build/outputs/apk/debug/app-debug.apk metronome-fire-tv.apk
          ls -lh metronome-fire-tv.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: metronome-fire-tv-apk
          path: metronome-fire-tv.apk
          if-no-files-found: error

      - name: Publish public Downloader APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fire-tv-latest
          name: Fire TV Latest
          body: Fire TV Web App APK with saved URL support
          files: metronome-fire-tv.apk
          overwrite_files: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
