name: Build iPhone Share TV APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/iphone-share-tv

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build APK
        run: gradle assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/*.apk app/build/outputs/apk/debug/coin-ai-tv.apk

      - name: Publish APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-latest
          name: Coin AI TV Latest
          prerelease: false
          make_latest: true
          files: apps/iphone-share-tv/app/build/outputs/apk/debug/coin-ai-tv.apk
