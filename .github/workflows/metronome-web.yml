name: Build Metronome Web App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Metronome files
        run: |
          test -f apps/metronome/index.html
          test -f apps/metronome/manifest.webmanifest

      - name: Package web app
        run: |
          rm -rf dist
          mkdir -p dist
          cp -r apps/metronome/. dist/
          cd dist
          zip -r ../metronome-web-app.zip .

      - name: Upload web app artifact
        uses: actions/upload-artifact@v4
        with:
          name: metronome-web-app
          path: metronome-web-app.zip