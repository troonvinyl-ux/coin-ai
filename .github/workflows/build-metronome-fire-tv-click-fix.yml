name: Build Metronome Fire TV APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Create Fire TV app
        run: |
          rm -rf firetv-build
          mkdir -p firetv-build/app/src/main/java/com/keenoncoins/metronome
          mkdir -p firetv-build/app/src/main/assets
          mkdir -p firetv-build/app/src/main/res/values

          cat > firetv-build/app/src/main/assets/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <title>BeatRun Metronome</title>
          <style>
          :root{--bg:#0b0d10;--panel:#151920;--text:#f5f7fa;--muted:#9da6b2;--accent:#5ee1a2;--danger:#ff6978}
          *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
          .app{max-width:560px;margin:auto;padding:22px 18px 36px}
          h1{font-size:28px;margin:0 0 4px}.sub{color:var(--muted);font-size:14px;margin-bottom:22px}
          .card{background:var(--panel);border-radius:18px;padding:18px;margin:12px 0}
          .mode{text-align:center;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:1.5px;font-size:13px}
          .bpm{text-align:center;font-size:76px;font-weight:800;line-height:1;margin:10px 0}
          .unit{text-align:center;color:var(--muted);font-size:13px}
          .beat{height:14px;width:14px;border-radius:50%;background:#39414c;margin:18px auto;transition:.04s}
          .beat.on{background:var(--accent);box-shadow:0 0 28px var(--accent);transform:scale(1.8)}
          .timer{text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
          button{border:0;border-radius:13px;padding:15px 18px;font-size:16px;font-weight:700;background:#262d36;color:white;cursor:pointer}
          button.primary{background:var(--accent);color:#07120c;width:100%;font-size:19px}
          button.stop{background:var(--danger);color:#190509;width:100%}
          .row{display:flex;gap:10px}.row button{flex:1}
          details summary{cursor:pointer;font-weight:700;padding:2px 0 12px}
          label{display:flex;justify-content:space-between;align-items:center;margin:13px 0;color:#dce1e7}
          input[type=number]{width:105px;background:#0e1116;border:1px solid #343c47;color:white;border-radius:10px;padding:10px;font-size:16px}
          input[type=file]{width:100%;padding:10px 0;color:var(--muted)}
          .media{display:none;margin-top:12px;border-radius:14px;overflow:hidden;background:#000}
          .media img,.media video{display:block;width:100%;max-height:52vh;object-fit:contain}
          .small{font-size:12px;color:var(--muted);line-height:1.45}
button:focus,summary:focus,input:focus{outline:3px solid #ffffff;outline-offset:3px}

          </style>
          </head>
          <body>
          <div class="app">
            <h1>BeatRun</h1>
            <div class="sub">Continuous 10-second changing metronome</div>
          
            <div class="card">
              <div id="mode" class="mode">Ready</div>
              <div id="bpm" class="bpm">60</div>
              <div class="unit">BPM</div>
              <div id="beat" class="beat"></div>
              <div id="timer" class="timer">10.0s</div>
            </div>
          
            <div class="card">
              <button id="start" class="primary">Start</button>
              <div class="row" style="margin-top:10px">
                <button id="reset">Reset</button>
              </div>
            </div>
          
            <div class="card">
              <details>
                <summary>Settings</summary>
                <label>Slow <input id="slow" type="number" min="1" max="999" value="60"></label>
                <label>Medium <input id="medium" type="number" min="1" max="999" value="90"></label>
                <label>Steady <input id="steady" type="number" min="1" max="999" value="100"></label>
                <label>Quick <input id="quick" type="number" min="1" max="999" value="130"></label>
                <label>Stop <input id="stop" type="number" min="0" max="999" value="0"></label>
                <label>Turbo <input id="turbo" type="number" min="1" max="999" value="300"></label>
                <div class="small">Each stage lasts 10 seconds. Turbo is randomly 2–6 stages, followed by one Stop stage.</div>
              </details>
            </div>
          
            <div class="card">
              <details>
                <summary>Image / Video (optional)</summary>
                <input id="mediaInput" type="file" accept="image/*,video/*">
                <div id="media" class="media"></div>
                <div class="row" style="margin-top:10px">
                  <button id="mute" style="display:none">Mute video</button>
                  <button id="clear" style="display:none">Remove media</button>
                </div>
              </details>
            </div>
          </div>
          
          <script>
          const modes={slow:"Slow",medium:"Medium",steady:"Steady",quick:"Quick",stop:"Stop",turbo:"Turbo"};
          let vals={slow:60,medium:90,steady:100,quick:130,stop:0,turbo:300};
          let sequence=[], stage=0, turboLeft=0, running=false, audioCtx=null, timerId=null, beatTimer=null, nextBeat=0, mediaURL=null;
          const $=id=>document.getElementById(id);
          
          function loadSettings(){
            Object.keys(vals).forEach(k=>{
              const v=localStorage.getItem("br_"+k);
              if(v!==null) vals[k]=Number(v);
              $(k).value=vals[k];
              $(k).onchange=()=>{vals[k]=Math.max(0,Number($(k).value)||0);localStorage.setItem("br_"+k,vals[k]);if(!running) showStage(sequence[stage]||"slow");};
            });
          }
          function normalNext(){
            const a=["slow","medium","steady","quick"];
            return a[Math.floor(Math.random()*a.length)];
          }
          function makeSequence(){
            sequence=[];
            for(let i=0;i<3;i++) sequence.push(normalNext());
            turboLeft=2+Math.floor(Math.random()*5);
            for(let i=0;i<turboLeft;i++) sequence.push("turbo");
            sequence.push("stop");
            stage=0;
          }
          function showStage(k){
            const bpm=vals[k];
            $("mode").textContent=modes[k];
            $("bpm").textContent=bpm;
            $("timer").textContent="10.0s";
            if(k==="stop") $("bpm").textContent="—";
          }
          function startAudio(){
            audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();
            if(audioCtx.state==="suspended") audioCtx.resume();
          }
          function clickBeat(){
            if(!audioCtx || !running) return;
            const k=sequence[stage];
            const bpm=vals[k];
            if(k==="stop" || bpm<=0) return;
            const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
            osc.type="square"; osc.frequency.value=1100;
            gain.gain.setValueAtTime(0.0001,audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.22,audioCtx.currentTime+0.001);
            gain.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+0.035);
            osc.connect(gain).connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime+0.04);
            $("beat").classList.add("on"); setTimeout(()=>$("beat").classList.remove("on"),55);
          }
          function beatLoop(){
            if(!running) return;
            const bpm=vals[sequence[stage]];
            const interval=60000/bpm;
            clickBeat();
            beatTimer=setTimeout(beatLoop,Math.max(8,interval));
          }
          function startStage(){
            showStage(sequence[stage]);
            clearTimeout(beatTimer);
            if(vals[sequence[stage]]>0) beatLoop();
            const end=performance.now()+10000;
            clearInterval(timerId);
            timerId=setInterval(()=>{
              const left=Math.max(0,end-performance.now());
              $("timer").textContent=(left/1000).toFixed(1)+"s";
              if(left<=0){clearInterval(timerId);advance();}
            },50);
          }
          function advance(){
            stage++;
            if(stage>=sequence.length) makeSequence();
            startStage();
          }
          $("start").onclick=()=>{
            if(running){running=false;clearTimeout(beatTimer);clearInterval(timerId);$("start").textContent="Start";$("start").className="primary";$("mode").textContent="Paused";return}
            startAudio(); running=true; $("start").textContent="Stop"; $("start").className="stop";
            makeSequence(); startStage();
          };
          $("reset").onclick=()=>{
            running=false;clearTimeout(beatTimer);clearInterval(timerId);makeSequence();stage=0;showStage("slow");$("start").textContent="Start";$("start").className="primary";
          };
          $("mediaInput").onchange=e=>{
            const f=e.target.files[0]; if(!f)return;
            if(mediaURL)URL.revokeObjectURL(mediaURL); mediaURL=URL.createObjectURL(f);
            const box=$("media");box.innerHTML="";
            let el;
            if(f.type.startsWith("video/")){el=document.createElement("video");el.controls=true;el.playsInline=true;el.muted=true;$("mute").style.display="block";}
            else {el=document.createElement("img");$("mute").style.display="none";}
            el.src=mediaURL;box.appendChild(el);box.style.display="block";$("clear").style.display="block";
          };
          $("mute").onclick=()=>{const v=$("media video");if(v){v.muted=!v.muted;$("mute").textContent=v.muted?"Unmute video":"Mute video"}};
          $("clear").onclick=()=>{if(mediaURL)URL.revokeObjectURL(mediaURL);mediaURL=null;$("media").innerHTML="";$("media").style.display="none";$("mediaInput").value="";$("clear").style.display="none";$("mute").style.display="none"};
          // Fire TV remote / D-pad support.
document.querySelectorAll("button,summary,input").forEach(el=>{
  el.setAttribute("tabindex","0");
  el.style.pointerEvents="auto";
});
let fireTvFocusIndex=0;
const fireTvFocusables=()=>Array.from(document.querySelectorAll("button,summary,input"));
function focusFireTv(){
  const a=fireTvFocusables();
  if(!a.length)return;
  fireTvFocusIndex=Math.max(0,Math.min(fireTvFocusIndex,a.length-1));
  a[fireTvFocusIndex].focus();
}
document.addEventListener("keydown",e=>{
  const a=fireTvFocusables();
  if(!a.length)return;
  if(e.key==="ArrowDown"||e.key==="ArrowRight"){
    e.preventDefault(); fireTvFocusIndex=(fireTvFocusIndex+1)%a.length; focusFireTv();
  } else if(e.key==="ArrowUp"||e.key==="ArrowLeft"){
    e.preventDefault(); fireTvFocusIndex=(fireTvFocusIndex-1+a.length)%a.length; focusFireTv();
  } else if(e.key==="Enter"||e.key===" "){
    const el=document.activeElement;
    if(el && (el.tagName==="BUTTON"||el.tagName==="SUMMARY")){
      e.preventDefault(); el.click();
    }
  }
});
setTimeout(focusFireTv,150);
loadSettings();makeSequence();showStage("slow");
          </script>
          </body>
          </html>
          HTML

          cat > firetv-build/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MetronomeFireTV"
          include(":app")
          EOF

          cat > firetv-build/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > firetv-build/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.keenoncoins.metronome'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.keenoncoins.metronome'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > firetv-build/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">BeatRun Metronome</string>
          </resources>
          EOF

          cat > firetv-build/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:colorAccent">#ffffff</item>
                  <item name="android:navigationBarColor">#0b0d10</item>
                  <item name="android:statusBarColor">#0b0d10</item>
              </style>
          </resources>
          EOF

          cat > firetv-build/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature
                  android:name="android.software.leanback"
                  android:required="false" />

              <uses-feature
                  android:name="android.hardware.touchscreen"
                  android:required="false" />

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="@string/app_name"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:resizeableActivity="false">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="landscape"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > firetv-build/app/src/main/java/com/keenoncoins/metronome/MainActivity.java <<'EOF'
          package com.keenoncoins.metronome;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.KeyEvent;
          import android.view.View;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView web;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setFlags(
                      android.view.WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      android.view.WindowManager.LayoutParams.FLAG_FULLSCREEN
                  );

                  web = new WebView(this);
                  web.setFocusable(true);
                  web.setFocusableInTouchMode(true);
                  web.setClickable(true);
                  web.requestFocus(View.FOCUS_DOWN);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  s.setBuiltInZoomControls(false);
                  s.setDisplayZoomControls(false);

                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient());

                  web.loadUrl("file:///android_asset/index.html");
                  setContentView(web);
              }

              @Override
              public boolean dispatchKeyEvent(KeyEvent event) {
                  if (web != null && event.getAction() == KeyEvent.ACTION_DOWN) {
                      web.requestFocus();
                  }
                  return super.dispatchKeyEvent(event);
              }

              @Override
              public void onBackPressed() {
                  if (web != null && web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (web != null) {
                      web.stopLoading();
                      web.destroy();
                      web = null;
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Install Gradle
        run: |
          curl -L --fail -o gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Build APK
        working-directory: firetv-build
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare APK
        run: |
          cp firetv-build/app/build/outputs/apk/debug/app-debug.apk metronome-fire-tv.apk
          ls -lh metronome-fire-tv.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: metronome-fire-tv-apk
          path: metronome-fire-tv.apk
          if-no-files-found: error

      - name: Publish public Downloader APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fire-tv-latest
          name: Fire TV Latest
          body: BeatRun Metronome Fire TV APK
          files: metronome-fire-tv.apk
          overwrite_files: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
